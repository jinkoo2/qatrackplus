version: "3.6"

services:
  qatrack-nginx:
    restart: always
    image: nginx:1.15
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Assuming this docker-compose.yml is in deploy/docker/,
      # ../../qatrack/static points to the qatrack/static inside your project root.
      - ../../qatrack/static:/usr/src/qatrackplus/qatrack/static:ro
      - ../../qatrack/media:/usr/src/qatrackplus/qatrack/media:rw
      - ./user-data/ssl:/root/ssl:ro
    links:
      - qatrack-django:qatrack-django
    ports:
      - "80:80"
      - "443:443"

  qatrack-django:
    restart: always
    build: 
      context: ../../. # Set the build context to the QATrack+ project root
      dockerfile: ./deploy/docker/django/Dockerfile # Specify the Dockerfile path relative to the new context
    links:
      - qatrack-postgres:qatrack-postgres
    volumes:
      # This mounts the entire QATrack+ project root from your host
      # to /usr/src/qatrackplus inside the container.
      # This assumes docker-compose.yml is in deploy/docker/ of your project.
      - ../../.:/usr/src/qatrackplus:rw
      - ./user-data/pip-cache:/root/.cache/pip:rw
    # REMOVED: command: /bin/bash -c 'cd /usr/src/qatrackplus; dos2unix deploy/docker/init.sh; deploy/docker/init.sh'
    # This command is now handled by the 'CMD' instruction within the 'django/Dockerfile'.
    # This is a cleaner approach and prevents issues with the virtual environment setup.

  qatrack-postgres:
    restart: always
    image: postgres:10.4
    # IMPORTANT: Set these environment variables to match your Django DATABASES settings.
    # Replace 'your_db_password_here' with the actual secure password you want to use.
    # These will be used by the Postgres image to initialize the database and user on first run.
    environment:
      POSTGRES_DB: qatrackplus31          # Matches 'NAME' in Django settings
      POSTGRES_USER: qatrack              # Matches 'USER' for default DB in Django settings
      POSTGRES_PASSWORD: qatrackpass      # Matches 'PASSWORD' for default DB in Django settings
      # You may need to manually create the 'qatrack_reports' user and grant permissions
      # within the PostgreSQL container after it starts, or via a custom initdb.d script.
    volumes:
      # This maps a Docker named volume to the Postgres data directory.
      # Data will persist across container restarts.
      - qatrack-postgres-volume:/var/lib/postgresql/data:rw

volumes:
  # Define the named volume for PostgreSQL data persistence.
  qatrack-postgres-volume: