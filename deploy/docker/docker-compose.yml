# docker-compose.yml for QATrack+ Production
# Version 3.8 is used for better compatibility with Docker Compose features.
version: '3.8'

services:
  # PostgreSQL Database Service
  db:
    image: postgres:10-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: qatrackplus
      POSTGRES_USER: qatrackplus
      POSTGRES_PASSWORD: qatrackplus_password
    networks:
      - qatrack_network
    restart: always

  # Redis Service (for Django Q background tasks)
  redis:
    image: redis:alpine
    networks:
      - qatrack_network
    restart: always

  # Django Application Service (Gunicorn)
  app:
    build:
      context: ../../
      dockerfile: ./deploy/docker/Dockerfile
    volumes:
      # These volumes are needed to collect static and media files for Nginx to serve
      - static_volume:/usr/src/qatrackplus/static
      - media_volume:/usr/src/qatrackplus/media
      - log_data:/usr/src/qatrackplus/logs/
      - ../../:/usr/src/qatrackplus
    command: /usr/src/qatrackplus/deploy/docker/init.sh # Revert to the production init script
    environment:
      DJANGO_SETTINGS_MODULE: qatrack.settings
      SECRET_KEY: "your_very_secret_key_here"
      DEBUG: "False" # IMPORTANT: Set to "False" for production
      ALLOWED_HOSTS: "localhost,127.0.0.1,roweb3.uhmc.sbuh.stonybrook.edu"
      TIME_ZONE: "America/New_York"
      DATABASE_URL: "postgres://qatrackplus:qatrackplus_password@db:5432/qatrackplus"
      REDIS_URL: "redis://redis:6379/0"
      ADMIN_NAME: "Jinkoo Kim"
      ADMIN_EMAIL: "jinkoo.kim@stonybrookmedicine.edu"
      AD_DNS_NAME: "uhmc-dc-04.uhmc.sbuh.stonybrook.edu"
      AD_SEARCH_DN: "DC=uhmc,DC=sbuh,DC=stonybrook,DC=edu"
      AD_NT4_DOMAIN: "UHMC"
      AD_LDAP_PORT: "389"
      AD_MIRROR_GROUPS: "True"
      EMAIL_NOTIFICATION_SENDER: "radonc.physics@stonybrookmedicine.edu"
      EMAIL_FAIL_SILENTLY: "False"
      EMAIL_HOST: "uhmc-imail.uhmc.sunysb.edu"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      EMAIL_USE_TLS: "False"
      EMAIL_PORT: "25"
      DEFAULT_FROM_EMAIL: "radonc.physics@stonybrookmedicine.edu"
      EMAIL_NOTIFICATION_USER: ""
      EMAIL_NOTIFICATION_PWD: ""
    depends_on:
      - db
      - redis
    networks:
      - qatrack_network
    restart: always

  # Nginx Web Server Service
  nginx:
    image: nginx:alpine
    volumes:
      # Correct paths to match Django's STATIC_ROOT and MEDIA_ROOT inside the app container
      - static_volume:/vol/web/static
      - media_volume:/vol/web/media
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro # Mount Nginx configuration
    ports:
      - "80:80" # Map host port 80 to container port 80
    depends_on:
      - app # Ensure app service starts before nginx
    networks:
      - qatrack_network
    restart: always

# Define named volumes for persistent data
volumes:
  postgres_data:
  static_volume:
  media_volume:
  log_data:

# Define a custom network for inter-service communication
networks:
  qatrack_network:
    driver: bridge