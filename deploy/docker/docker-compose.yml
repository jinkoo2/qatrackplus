# docker-compose.yml for QATrack+ Production
# Version 3.8 is used for better compatibility with Docker Compose features.
version: '3.8'

services:
  # PostgreSQL Database Service
  db:
    image: postgres:10-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      #  openssl rand -hex 32
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - qatrack_network
    restart: always

  # Redis Service (for Django Q background tasks)
  redis:
    image: redis:alpine
    networks:
      - qatrack_network
    restart: always

  # Django Application Service (Gunicorn)
  app:
    build:
      context: ../../
      dockerfile: ./deploy/docker/Dockerfile
    volumes:
      # These volumes are needed to collect static and media files for Nginx to serve
      - static_volume:/usr/src/qatrackplus/static
      - media_volume:/usr/src/qatrackplus/media
      - log_data:/usr/src/qatrackplus/logs/
      - ../../:/usr/src/qatrackplus
    command: /usr/src/qatrackplus/deploy/docker/init.sh # Revert to the production init script
    environment:
      DJANGO_SETTINGS_MODULE: qatrack.settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False" # IMPORTANT: Set to "False" for production
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      TIME_ZONE: "America/New_York"
      DATABASE_URL: "postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
      REDIS_URL: "redis://redis:6379/0"
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      AD_DNS_NAME: ${AD_DNS_NAME}
      AD_SEARCH_DN: ${AD_SEARCH_DN}
      AD_NT4_DOMAIN: ${AD_NT4_DOMAIN}
      AD_LDAP_PORT: ${AD_LDAP_PORT}
      AD_MIRROR_GROUPS: ${AD_MIRROR_GROUPS}
      EMAIL_NOTIFICATION_SENDER: ${EMAIL_NOTIFICATION_SENDER}
      EMAIL_FAIL_SILENTLY: "False"
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: "False"
      EMAIL_PORT: "25"
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL} 
      EMAIL_NOTIFICATION_USER: ${EMAIL_NOTIFICATION_USER}
      EMAIL_NOTIFICATION_PWD: ${EMAIL_NOTIFICATION_PWD}
    depends_on:
      - db
      - redis
    networks:
      - qatrack_network
    restart: always

  # Nginx Web Server Service
  qatrack-nginx:
    # Build the custom image from the local Dockerfile
    build:
      context: ./nginx-custom
    volumes:
      - static_volume:/vol/web/static
      - media_volume:/vol/web/media
    ports:
      - "8000:80" # Map host port 80 to container port 80
    environment:
      - INTERNAL_SERVER_NAME=${INTERNAL_SERVER_NAME:-app}
      - INTERNAL_SERVER_PORT=${INTERNAL_SERVER_PORT:-8000}
      - SERVER_NAME=${SERVER_NAME:-roweb3.uhmc.sbuh.stonybrook.edu} # Pass the server name
    depends_on:
      - app
    networks:
      - qatrack_network
    restart: always

# Define named volumes for persistent data
volumes:
  postgres_data:
  static_volume:
  media_volume:
  log_data:

# Define a custom network for inter-service communication
networks:
  qatrack_network:
    driver: bridge