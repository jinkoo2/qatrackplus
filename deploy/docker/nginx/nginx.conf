# Nginx configuration for QATrack+
# This file is intended to be included within the 'http' block of the main nginx.conf.
# Therefore, it should ONLY contain server blocks and their locations.

server {
    listen 80; # Listen on port 80 for incoming HTTP requests
    server_name localhost; # Replace with your domain name or IP address

    # Increase the maximum allowed size of the client request body (e.g., for file uploads)
    client_max_body_size 1024M; # Set to 1024 megabytes, adjust as needed
    
    # Serve static files directly from the Nginx container's /vol/web/static directory
    location /static/ {
        alias /vol/web/static/;
        expires 30d; # Cache static files for 30 days
        add_header Cache-Control "public";
    }

    # Serve media files directly from the Nginx container's /vol/web/media directory
    location /media/ {
        alias /vol/web/media/;
        expires 30d; # Cache media files for 30 days
        add_header Cache-Control "public";
    }

    # Proxy all other requests to the Django application (Gunicorn)
    location / {
        proxy_pass http://app:8000; # 'app' is the name of the Django service in docker-compose
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}
