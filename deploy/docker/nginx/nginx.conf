# The 'events' block sets global configurations for Nginx.
events {
    worker_connections 1024;
}

http{
    # HTTPS server block
    server {
        listen 8443 ssl;
        server_name roweb3.uhmc.sbuh.stonybrook.edu;

        # Point to the certificate and key files on the host
        ssl_certificate /etc/ssl/certs/roweb3.cer;
        ssl_certificate_key /etc/ssl/private/roweb3.key;

        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 5m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://roweb3.uhmc.sbuh.stonybrook.edu:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

}