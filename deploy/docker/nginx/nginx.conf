# Nginx configuration for QATrack+
# This file is intended to be included within the 'http' block of the main nginx.conf.
# Therefore, it should ONLY contain server blocks and their locations.

server {
    listen 80; # Listen on port 80 for incoming HTTP requests
    server_name roweb3.uhmc.sbuh.stonybrook.edu; # Updated with your host name

    # Increase the maximum allowed size of the client request body (e.g., for file uploads)
    client_max_body_size 1024M; # Set to 1024 megabytes, adjust as needed

    # This location block handles all requests to /qatrackplus and its subpaths
    location / {
        # Define the URI for the proxy to use. The trailing slash is crucial.
        # It sends the request to the root of the app container.
        proxy_pass http://app:8000/;

        # Set headers to correctly route traffic and provide host information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /qatrackplus; # This tells Django what the subpath is
    }

    # This block serves static files for the subpath
    location /static/ {
        alias /vol/web/static/;
        expires 30d; # Cache static files for 30 days
        add_header Cache-Control "public";
    }

    # This block serves media files for the subpath
    location /media/ {
        alias /vol/web/media/;
        expires 30d; # Cache media files for 30 days
        add_header Cache-Control "public";
    }
}